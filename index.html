<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcella Volley Scoreboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        .animate-fall {
            animation: fall linear forwards;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .overflow-y-auto::-webkit-scrollbar {
            display: none;
        }
        /* Prevent text selection on double-click and drag */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Team Panel Styles */
        .team-panel {
            width: calc((100vw - 10rem) / 2);
        }

        /* Logo Styles */
        .logo-size {
            height: clamp(6rem, 15vh, 18rem);
            width: clamp(6rem, 15vh, 18rem);
        }

        /* Reserve space for logo even when empty */
        .logo-container {
            min-height: clamp(6rem, 15vh, 18rem);
            min-width: clamp(6rem, 15vh, 18rem);
            height: clamp(6rem, 15vh, 18rem);
            width: clamp(6rem, 15vh, 18rem);
        }

        .logo-placeholder-text {
            font-size: clamp(0.65rem, 0.8vw, 0.85rem);
        }

        /* Team Name */
        .team-name {
            font-size: clamp(1.75rem, 3vw, 3.5rem);
            line-height: 1.2;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        /* Shrink team name when it gets long */
        .team-name.medium {
            font-size: clamp(1.25rem, 2.5vw, 2.75rem);
        }

        .team-name.small {
            font-size: clamp(1rem, 2vw, 2rem);
        }

        /* Timeout Styles */
        .timeout-label {
            font-size: 1rem; /* text-4xl */
        }

        .timeout-number {
            font-size: 6.5rem; /* text-6xl */
        }

        /* Score Styles */
        .score-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .score-display {
            font-size: min(45vw, 70vh);
            line-height: 0.85;
            font-stretch: condensed;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        /* Shrink score text when numbers get large */
        .score-display.large {
            font-size: min(30vw, 52vh);
        }

        .score-display.very-large {
            font-size: min(25vw, 50vh);
        }

        /* Top Bar Styles */
        .venue-text {
            font-size: clamp(1.5rem, 2.5vw, 2.5rem);
        }

        .date-text {
            font-size: clamp(1.25rem, 2vw, 2rem);
        }

        /* Current Set Styles */
        .current-set-label {
            font-size: clamp(1.5rem, 2.25vw, 2.25rem);
        }

        .current-set-number {
            font-size: clamp(4.5rem, 9.5vw, 10rem);
            margin-top: -40px;
            margin-bottom: -40px;
        }

        /* Sets Won Styles */
        .sets-label {
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            margin-bottom: -20px
        }

        .sets-number {
            font-size: clamp(3rem, 5vw, 5rem);
        }

        /* Winner Message */
        .winner-message {
            font-size: clamp(3rem, 6vw, 6rem);
        }

        /* Band layout: sizes are px on a fixed 1920x1080 stage, scaled as a whole */
        .band-stage {
            width: 1920px;
            height: 1080px;
            font-family: 'Barlow Condensed', sans-serif;
            transform-origin: top left;
        }

        .band-top, .band-bottom {
            height: 200px;
        }

        .band-logo {
            width: 150px;
            height: 150px;
        }

        .band-team-name {
            font-size: 76px;
            line-height: 0.95;
        }

        .band-team-name.medium {
            font-size: 64px;
        }

        .band-team-name.small {
            font-size: 52px;
        }

        .band-set-label {
            font-size: 48px;
            line-height: 1;
        }

        .band-set-number {
            font-size: 130px;
            line-height: 0.85;
        }

        /* Keep each score clear of the set chips straddling the center line */
        .band-score-cell.left {
            padding-right: 110px;
        }

        .band-score-cell.right {
            padding-left: 110px;
        }

        .band-score {
            font-size: 820px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            /* Digits sit low in the line box (room reserved for ascenders); lift them to center optically */
            transform: translateY(-0.06em);
        }

        .band-score.very-large {
            font-size: 520px;
        }

        .band-timeout-label {
            font-size: 52px;
        }

        .band-timeout-number {
            font-size: 110px;
            line-height: 1;
        }

        .band-history {
            top: 224px;
            left: 50%;
            transform: translateX(-50%);
        }

        .band-history-score {
            font-size: 64px;
            line-height: 1;
            width: 104px;
        }

        .band-venue {
            font-size: 56px;
            line-height: 1.1;
        }

        .band-date {
            font-size: 40px;
            line-height: 1.1;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide Icons (simplified versions)
        const Menu = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        );

        const RotateCw = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
        );

        const Flag = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                <line x1="4" y1="22" x2="4" y2="15"></line>
            </svg>
        );

        const Edit = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        );

        const Maximize = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
        );

        const Monitor = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
        );

        // Display-Only Scoreboard Component (for second screen)
        function DisplayOnlyScoreboard({ teamData, setHistory, showConfetti, winnerMessage }) {
            const [isFullscreen, setIsFullscreen] = useState(false);

            const getCurrentDate = () => {
                const today = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                return today.toLocaleDateString('it-IT', options);
            };

            const getCurrentSet = () => {
                return teamData.left.sets + teamData.right.sets + 1;
            };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error('Error attempting to enable fullscreen:', err);
                    });
                } else {
                    document.exitFullscreen();
                }
            };

            // Monitor fullscreen changes
            useEffect(() => {
                const handleFullscreenChange = () => {
                    setIsFullscreen(!!document.fullscreenElement);
                };

                document.addEventListener('fullscreenchange', handleFullscreenChange);

                return () => {
                    document.removeEventListener('fullscreenchange', handleFullscreenChange);
                };
            }, []);

            // Simplified TeamPanel without controls
            function DisplayTeamPanel({ side, team }) {
                const isLeft = side === 'left';
                const flexOrderClass = isLeft ? '' : 'flex-row-reverse';

                const getScoreClass = (score) => {
                    if (score >= 100) return 'very-large';
                    if (score >= 10) return 'large';
                    return '';
                };

                const getTeamNameClass = (name) => {
                    const length = name.length;
                    if (length > 20) return 'small';
                    if (length > 15) return 'medium';
                    return '';
                };

                return (
                    <div className={`team-panel flex-shrink-0 ${team.theme.bgColor} ${team.theme.textColor} flex flex-col`}>
                        <div className={`flex ${flexOrderClass} h-full`}>
                            <div className="flex flex-col items-center justify-between p-6 h-full">
                                <div className="flex flex-col items-center gap-6">
                                    {/* Logo */}
                                    <div className="logo-container flex-shrink-0">
                                        {team.logo ? (
                                            <img
                                                src={team.logo}
                                                alt={`${team.name} Logo`}
                                                className="logo-size object-contain"
                                            />
                                        ) : (
                                            <div className="logo-size border-2 border-dashed border-gray-400 rounded flex items-center justify-center"></div>
                                        )}
                                    </div>

                                    {/* Timeouts */}
                                    <div className="text-center">
                                        <div className="timeout-label font-bold">TIMEOUT</div>
                                        <div className="timeout-number font-bold" style={{ marginTop: '-30px' }}>{team.timeouts}</div>
                                    </div>
                                </div>
                            </div>

                            {/* Team Name and Score */}
                            <div className="flex-1 flex flex-col py-6">
                                <div className="text-center px-4 flex-shrink-0">
                                    <h2 className={`team-name ${getTeamNameClass(team.name)} font-bold uppercase`}>
                                        {team.name}
                                    </h2>
                                </div>

                                {/* Score */}
                                <div className="flex-1 flex items-center justify-center min-h-0 px-4">
                                    <div className="score-container">
                                        <div className={`score-display ${getScoreClass(team.score)} font-bold leading-none text-center`}>
                                            {team.score}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen bg-black text-white flex flex-col relative overflow-hidden">
                    {/* Confetti Overlay */}
                    {showConfetti && (
                        <div className="fixed inset-0 z-50 pointer-events-none overflow-hidden">
                            <div className="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                                <div className="winner-message font-bold text-yellow-400 animate-pulse">
                                    {winnerMessage}
                                </div>
                            </div>
                            {[...Array(50)].map((_, i) => (
                                <div
                                    key={i}
                                    className="absolute animate-fall"
                                    style={{
                                        left: `${Math.random() * 100}%`,
                                        top: `-20px`,
                                        animationDelay: `${Math.random() * 0.5}s`,
                                        animationDuration: `${2 + Math.random() * 2}s`
                                    }}
                                >
                                    <div
                                        className={`w-3 h-3 ${
                                            Math.random() > 0.5 ? 'bg-yellow-400' : 'bg-white'
                                        } rounded-full`}
                                    />
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Top Stripe */}
                    <div className="bg-yellow-400 text-black py-3 px-6">
                        <div className="flex justify-between items-center">
                            <div className="venue-text font-bold">
                                Palestra "R. Barion"
                            </div>
                            <div className="date-text font-semibold">
                                {getCurrentDate()}
                            </div>
                        </div>
                    </div>

                    {/* Main Scoreboard */}
                    <div className="flex-1 flex min-h-0">
                        <DisplayTeamPanel side="left" team={teamData.left} />

                        {/* Center Divider */}
                        <div className="w-40 bg-yellow-400 flex flex-col">
                            {/* Current Set Indicator */}
                            <div className="py-6 text-center border-b-2 border-black">
                                <div className="current-set-label text-black font-bold mb-2">
                                    SET
                                </div>
                                <div className="current-set-number text-black font-bold">
                                    {getCurrentSet()}
                                </div>
                            </div>

                            {/* Sets Won Display */}
                            <div className="py-4 text-center border-b-2 border-black">
                                <div className="sets-label text-black font-bold">
                                    SET
                                </div>
                                <div className="flex justify-center items-center gap-4">
                                    <div className="sets-number text-black font-bold">{teamData.left.sets}</div>
                                    <div className="text-black font-bold text-2xl">-</div>
                                    <div className="sets-number text-black font-bold">{teamData.right.sets}</div>
                                </div>
                            </div>

                            {/* Set History */}
                            <div className="flex-1 flex flex-col items-center justify-start py-4 overflow-y-auto">
                                {setHistory.length > 0 && (
                                    <div className="flex flex-col gap-4 w-full px-4">
                                        {setHistory.map((set, index) => {
                                            const winnerTheme = set.winnerTheme || { bgColor: 'bg-black', textColor: 'text-white' };
                                            const winnerColor = `${winnerTheme.bgColor} ${winnerTheme.textColor}`;

                                            let currentLeftScore, currentRightScore;
                                            if (teamData.left.name === set.leftTeamName) {
                                                currentLeftScore = set.leftScore;
                                                currentRightScore = set.rightScore;
                                            } else {
                                                currentLeftScore = set.rightScore;
                                                currentRightScore = set.leftScore;
                                            }

                                            return (
                                                <div
                                                    key={index}
                                                    className={`${winnerColor} rounded-lg px-2 py-2 text-center`}
                                                >
                                                    <div className="flex items-center justify-center gap-2">
                                                        <span className="text-lg font-semibold">#{index + 1}:</span>
                                                        <span className="font-bold text-2xl">{currentLeftScore}-{currentRightScore}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* Fullscreen Button - Only show when not in fullscreen */}
                            {!isFullscreen && (
                                <div className="p-4">
                                    <button
                                        onClick={toggleFullscreen}
                                        className="w-full aspect-square bg-black text-yellow-400 hover:bg-gray-900 transition flex items-center justify-center rounded"
                                    >
                                        <Maximize size={32} />
                                    </button>
                                </div>
                            )}
                        </div>

                        <DisplayTeamPanel side="right" team={teamData.right} />
                    </div>
                </div>
            );
        }

        // Band layout: broadcast-style display drawn on a fixed 1920x1080 stage
        const STAGE_WIDTH = 1920;
        const STAGE_HEIGHT = 1080;

        function useStageScale() {
            const compute = () => Math.min(window.innerWidth / STAGE_WIDTH, window.innerHeight / STAGE_HEIGHT);
            const [scale, setScale] = useState(compute);

            useEffect(() => {
                const handleResize = () => setScale(compute());
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return scale;
        }

        function BandTeamHeader({ side, team }) {
            const isLeft = side === 'left';
            const nameClass = team.name.length > 20 ? 'small' : team.name.length > 15 ? 'medium' : '';

            return (
                <div className={`flex-1 flex items-center gap-8 px-10 ${isLeft ? '' : 'flex-row-reverse'} ${team.theme.bgColor} ${team.theme.textColor}`}>
                    <div className="band-logo flex-shrink-0 flex items-center justify-center">
                        {team.logo && <img src={team.logo} alt="" className="max-w-full max-h-full object-contain" />}
                    </div>
                    <div className={`band-team-name ${nameClass} flex-1 min-w-0 font-bold uppercase ${isLeft ? 'text-left' : 'text-right'}`}>
                        {team.name}
                    </div>
                </div>
            );
        }

        function BandTimeouts({ side, team, maxTimeouts }) {
            return (
                <div className={`flex items-baseline gap-6 font-bold ${side === 'left' ? '' : 'flex-row-reverse'}`}>
                    <div className="band-timeout-label">TIMEOUT</div>
                    <div className="band-timeout-number">{team.timeouts}/{maxTimeouts}</div>
                </div>
            );
        }

        function BandScoreboard({ teamData, setHistory, showConfetti, winnerMessage, maxTimeouts }) {
            const scale = useStageScale();
            const showDebug = new URLSearchParams(window.location.search).get('debug') === '1';
            const [isFullscreen, setIsFullscreen] = useState(!!document.fullscreenElement);

            useEffect(() => {
                const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            // Past sets are stored by the sides they were played on; show them from the current sides
            const historyFromCurrentSides = setHistory.map(set => {
                const sameSides = teamData.left.name === set.leftTeamName;
                return {
                    left: sameSides ? set.leftScore : set.rightScore,
                    right: sameSides ? set.rightScore : set.leftScore
                };
            });

            const scoreClass = (score) => score >= 100 ? 'very-large' : '';
            const offsetX = (window.innerWidth - STAGE_WIDTH * scale) / 2;
            const offsetY = (window.innerHeight - STAGE_HEIGHT * scale) / 2;

            return (
                <div className="h-screen w-screen bg-black overflow-hidden relative">
                    <div
                        className="band-stage absolute flex flex-col bg-black text-white overflow-hidden"
                        style={{ left: offsetX, top: offsetY, transform: `scale(${scale})` }}
                    >
                        {/* Top band: teams, sets won */}
                        <div className="band-top flex">
                            <BandTeamHeader side="left" team={teamData.left} />
                            <div className="w-80 bg-yellow-400 text-black flex flex-col items-center justify-center font-bold">
                                <div className="band-set-label">SET</div>
                                <div className="band-set-number">{teamData.left.sets} - {teamData.right.sets}</div>
                            </div>
                            <BandTeamHeader side="right" team={teamData.right} />
                        </div>

                        {/* Scores */}
                        <div className="flex-1 flex min-h-0">
                            {['left', 'right'].map((side, i) => (
                                <React.Fragment key={side}>
                                    {i === 1 && <div className="w-3 bg-yellow-400" />}
                                    <div className={`band-score-cell ${side} flex-1 flex items-center justify-center overflow-hidden ${teamData[side].theme.bgColor} ${teamData[side].theme.textColor}`}>
                                        <div className={`band-score ${scoreClass(teamData[side].score)} font-bold`}>
                                            {teamData[side].score}
                                        </div>
                                    </div>
                                </React.Fragment>
                            ))}
                        </div>

                        {/* Past sets, straddling the center line */}
                        {historyFromCurrentSides.length > 0 && (
                            <div className="band-history absolute flex flex-col gap-4">
                                {historyFromCurrentSides.map((set, index) => (
                                    <div key={index} className="flex bg-yellow-400 text-black font-bold rounded-xl overflow-hidden">
                                        <div className={`band-history-score text-center py-2 ${set.left > set.right ? '' : 'opacity-40'}`}>{set.left}</div>
                                        <div className="w-1 bg-black opacity-20" />
                                        <div className={`band-history-score text-center py-2 ${set.right > set.left ? '' : 'opacity-40'}`}>{set.right}</div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Bottom band: timeouts and venue */}
                        <div className="band-bottom bg-yellow-400 text-black flex items-center justify-between px-12">
                            <BandTimeouts side="left" team={teamData.left} maxTimeouts={maxTimeouts} />
                            <div className="text-center">
                                <div className="band-venue font-bold">Palestra "R. Barion"</div>
                                <div className="band-date font-semibold">
                                    {new Date().toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                                </div>
                            </div>
                            <BandTimeouts side="right" team={teamData.right} maxTimeouts={maxTimeouts} />
                        </div>

                        {/* Confetti Overlay */}
                        {showConfetti && (
                            <div className="absolute inset-0 z-50 pointer-events-none overflow-hidden">
                                <div className="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                                    <div className="font-bold text-yellow-400 animate-pulse" style={{ fontSize: 140 }}>
                                        {winnerMessage}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {!isFullscreen && (
                        <button
                            onClick={() => document.documentElement.requestFullscreen().catch(err => console.error('Error attempting to enable fullscreen:', err))}
                            className="absolute bottom-4 right-4 z-50 p-3 bg-black text-yellow-400 rounded opacity-50 hover:opacity-100 transition"
                        >
                            <Maximize size={32} />
                        </button>
                    )}

                    {showDebug && (
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 bg-red-600 text-white font-mono text-2xl px-4 py-2 rounded">
                            {window.innerWidth}×{window.innerHeight} @ dpr {window.devicePixelRatio} · scale {scale.toFixed(3)}
                        </div>
                    )}
                </div>
            );
        }

        // Team Panel Component
        function TeamPanel({
            side,
            team,
            matchStarted,
            manualEditMode,
            onChangeName,
            onChangeLogo,
            onUpdateTimeouts,
            onUpdateScore
        }) {
            const isLeft = side === 'left';
            // Matches the keyboard shortcuts in VolleyScoreboard: q = left +1, p = right +1
            const shortcutKey = isLeft ? 'Q' : 'P';
            const flexOrderClass = isLeft ? '' : 'flex-row-reverse';

            // Determine score size class based on score value
            const getScoreClass = (score) => {
                if (score >= 100) return 'very-large';
                if (score >= 10) return 'large';
                return '';
            };

            // Determine team name size class based on name length
            const getTeamNameClass = (name) => {
                const length = name.length;
                if (length > 20) return 'small';
                if (length > 15) return 'medium';
                return '';
            };

            return (
                <div className={`team-panel flex-shrink-0 ${team.theme.bgColor} ${team.theme.textColor} flex flex-col`}>
                    {/* Two-column layout */}
                    <div className={`flex ${flexOrderClass} h-full`}>
                        {/* Column 1: Logo, Timeout, and Score Minus Button */}
                        <div className="flex flex-col items-center justify-between p-6 h-full">
                            <div className="flex flex-col items-center gap-6">
                                {/* Logo with reserved space */}
                                <div
                                    className={`logo-container flex-shrink-0 ${matchStarted ? '' : 'cursor-pointer'}`}
                                    onClick={matchStarted ? undefined : () => onChangeLogo(side)}
                                >
                                    {team.logo ? (
                                        <img
                                            src={team.logo}
                                            alt={`${team.name} Logo`}
                                            className={`logo-size object-contain ${matchStarted ? '' : 'hover:opacity-70 transition'}`}
                                        />
                                    ) : (
                                        <div className="logo-size border-2 border-dashed border-gray-400 rounded flex items-center justify-center hover:border-gray-600 transition">
                                            {!matchStarted && (
                                                <span className="logo-placeholder-text text-gray-500">
                                                    + Logo
                                                </span>
                                            )}
                                        </div>
                                    )}
                                </div>

                                {/* Timeouts */}
                                <div className="flex items-center gap-2">
                                    {manualEditMode && (
                                        <button
                                            onClick={() => onUpdateTimeouts(side, -1)}
                                            className={`${team.theme.buttonBg} ${team.theme.buttonText} ${team.theme.buttonHover} w-12 h-12 rounded-full text-2xl font-bold transition`}
                                        >
                                            -
                                        </button>
                                    )}
                                    <div
                                        className="cursor-pointer hover:opacity-70 transition text-center"
                                        onClick={() => onUpdateTimeouts(side, 1)}
                                    >
                                        <div className="timeout-label font-bold">TIMEOUT</div>
                                        <div className="timeout-number font-bold" style={{ marginTop: '-30px' }}>{team.timeouts}</div>
                                    </div>
                                </div>
                            </div>

                            {/* Score Minus Button - At Bottom */}
                            <button
                                onClick={() => onUpdateScore(side, -1)}
                                className={`${team.theme.buttonBg} ${team.theme.buttonText} ${team.theme.buttonHover} w-20 h-20 rounded-full text-4xl font-bold transition flex-shrink-0`}
                            >
                                -
                            </button>
                        </div>

                        {/* Column 2: Team Name and Score (larger column, closer to center) */}
                        <div className="flex-1 flex flex-col py-6">
                            {/* Team Name */}
                            <div className="text-center px-4 flex-shrink-0">
                                <div
                                    className="cursor-pointer hover:opacity-70 transition p-2 rounded"
                                    onClick={() => onChangeName(side)}
                                >
                                    <h2 className={`team-name ${getTeamNameClass(team.name)} font-bold uppercase`}>
                                        {team.name}
                                    </h2>
                                </div>
                            </div>

                            {/* Score */}
                            <div className="flex-1 flex items-center justify-center min-h-0 px-4">
                                <div className="score-container">
                                    <div
                                        className={`score-display ${getScoreClass(team.score)} font-bold cursor-pointer hover:opacity-70 transition leading-none text-center`}
                                        onClick={() => onUpdateScore(side, 1)}
                                    >
                                        {team.score}
                                    </div>
                                </div>
                            </div>

                            {/* Keyboard shortcut hint */}
                            <div className="flex-shrink-0 flex items-center justify-center gap-2 opacity-60 text-lg">
                                <span>Premi</span>
                                <kbd className="px-2 py-0.5 border-2 border-current rounded font-mono font-bold">{shortcutKey}</kbd>
                                <span>per +1</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function VolleyScoreboard() {
            // Storage version - increment when breaking changes occur
            const STORAGE_VERSION = 2;

            // Detect if this is the display-only window
            const urlParams = new URLSearchParams(window.location.search);
            const isDisplayMode = urlParams.get('display') === 'true';

            // BroadcastChannel for cross-window communication
            const [broadcastChannel] = useState(() => new BroadcastChannel('scoreboard-sync'));

            // Default team configurations
            const DEFAULT_LEFT_TEAM = {
                name: 'Arcella Volley',
                score: 0,
                sets: 0,
                timeouts: 0,
                logo: 'https://www.arcellavolley.it/file/2014/05/Loghi-in-alto_051.png',
                theme: {
                    bgColor: 'bg-black',
                    textColor: 'text-white',
                    buttonBg: 'bg-white',
                    buttonText: 'text-black',
                    buttonHover: 'hover:bg-gray-200'
                }
            };

            const DEFAULT_RIGHT_TEAM = {
                name: 'Squadra Ospite',
                score: 0,
                sets: 0,
                timeouts: 0,
                logo: '',
                theme: {
                    bgColor: 'bg-white',
                    textColor: 'text-black',
                    buttonBg: 'bg-black',
                    buttonText: 'text-white',
                    buttonHover: 'hover:bg-gray-800'
                }
            };

            const [teamData, setTeamData] = useState({
                left: DEFAULT_LEFT_TEAM,
                right: DEFAULT_RIGHT_TEAM
            });

            const [setHistory, setSetHistory] = useState([]);
            const [menuOpen, setMenuOpen] = useState(false);
            const [manualEditMode, setManualEditMode] = useState(false);
            const [showConfetti, setShowConfetti] = useState(false);
            const [winnerMessage, setWinnerMessage] = useState('');
            const [displayWindow, setDisplayWindow] = useState(null);

            const maxTimeouts = 2;

            // Load from localStorage on mount
            useEffect(() => {
                const saved = localStorage.getItem('volleyScoreboard');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);

                        // Check version - if mismatch, ignore saved data
                        if (data.version !== STORAGE_VERSION) {
                            console.log('Storage version mismatch - using defaults');
                            return;
                        }

                        // Load with defaults as fallback
                        setTeamData({
                            left: { ...DEFAULT_LEFT_TEAM, ...data.teamData.left },
                            right: { ...DEFAULT_RIGHT_TEAM, ...data.teamData.right }
                        });
                        setSetHistory(data.setHistory || []);
                    } catch (e) {
                        console.error('Error loading saved data:', e);
                    }
                }
            }, []);

            // Save to localStorage whenever state changes
            useEffect(() => {
                const data = {
                    version: STORAGE_VERSION,
                    teamData,
                    setHistory
                };
                localStorage.setItem('volleyScoreboard', JSON.stringify(data));
            }, [teamData, setHistory]);

            // Listen for broadcasts from other windows
            useEffect(() => {
                const handleMessage = (event) => {
                    if (event.data.type === 'UPDATE_STATE') {
                        setTeamData(event.data.teamData);
                        setSetHistory(event.data.setHistory);
                    } else if (event.data.type === 'UPDATE_CONFETTI') {
                        setShowConfetti(event.data.showConfetti);
                        setWinnerMessage(event.data.winnerMessage);
                        setSetHistory(event.data.setHistory);
                    }
                };

                broadcastChannel.addEventListener('message', handleMessage);

                return () => {
                    broadcastChannel.removeEventListener('message', handleMessage);
                };
            }, [broadcastChannel]);

            const updateScore = (team, delta) => {
                const newScore = Math.max(0, teamData[team].score + delta);
                const newData = {
                    ...teamData,
                    [team]: { ...teamData[team], score: newScore }
                };
                setTeamData(newData);
                // Broadcast the change
                broadcastChannel.postMessage({ type: 'UPDATE_STATE', teamData: newData, setHistory });
            };

            // Keyboard shortcuts: q = +1 left, p = +1 right
            React.useEffect(() => {
                if (isDisplayMode) return;
                const handleKeyDown = (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    if (e.key === 'q' || e.key === 'Q') {
                        updateScore('left', 1);
                    } else if (e.key === 'p' || e.key === 'P') {
                        updateScore('right', 1);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            });

            const updateSets = (team, delta) => {
                const newSets = Math.max(0, teamData[team].sets + delta);
                const newData = {
                    ...teamData,
                    [team]: { ...teamData[team], sets: newSets }
                };
                setTeamData(newData);
                // Broadcast the change
                broadcastChannel.postMessage({ type: 'UPDATE_STATE', teamData: newData, setHistory });
            };

            const updateTimeouts = (team, delta) => {
                const newTimeouts = Math.max(0, Math.min(maxTimeouts, teamData[team].timeouts + delta));
                const newData = {
                    ...teamData,
                    [team]: { ...teamData[team], timeouts: newTimeouts }
                };
                setTeamData(newData);
                // Broadcast the change
                broadcastChannel.postMessage({ type: 'UPDATE_STATE', teamData: newData, setHistory });
            };

            const changeName = (team) => {
                const newName = prompt(`Inserisci il nome della squadra:`, teamData[team].name);
                if (newName && newName.trim()) {
                    const newData = {
                        ...teamData,
                        [team]: { ...teamData[team], name: newName.trim() }
                    };
                    setTeamData(newData);
                    // Broadcast the change
                    broadcastChannel.postMessage({ type: 'UPDATE_STATE', teamData: newData, setHistory });
                }
            };

            const changeLogo = (team) => {
                const newLogo = prompt(`Inserisci l'URL del logo:`, teamData[team].logo);
                if (newLogo !== null) {
                    const newData = {
                        ...teamData,
                        [team]: { ...teamData[team], logo: newLogo.trim() }
                    };
                    setTeamData(newData);
                    // Broadcast the change
                    broadcastChannel.postMessage({ type: 'UPDATE_STATE', teamData: newData, setHistory });
                }
            };

            const switchSides = () => {
                const newData = {
                    left: teamData.right,
                    right: teamData.left
                };
                setTeamData(newData);
                // Broadcast the change
                broadcastChannel.postMessage({ type: 'UPDATE_STATE', teamData: newData, setHistory });
                setMenuOpen(false);
            };

            const endSet = () => {
                const winner = teamData.left.score > teamData.right.score ? 'left' : 'right';
                const loser = winner === 'left' ? 'right' : 'left';
                const winnerName = teamData[winner].name;

                if (teamData.left.score === teamData.right.score) {
                    alert('Il punteggio è pari! Non è possibile terminare il set.');
                    return;
                }

                setWinnerMessage(`${winnerName} ha vinto il set!`);
                setShowConfetti(true);

                // Save set history with team info and theme
                const newHistory = [...setHistory, {
                    leftScore: teamData.left.score,
                    rightScore: teamData.right.score,
                    leftTeamName: teamData.left.name,
                    rightTeamName: teamData.right.name,
                    winnerName: winnerName,
                    winnerTheme: teamData[winner].theme
                }];
                setSetHistory(newHistory);

                // Broadcast confetti state
                broadcastChannel.postMessage({
                    type: 'UPDATE_CONFETTI',
                    showConfetti: true,
                    winnerMessage: `${winnerName} ha vinto il set!`,
                    setHistory: newHistory
                });

                setTimeout(() => {
                    // Increment set count for winner, reset scores and timeouts for both teams
                    // ALWAYS switch sides after each set (swap left/right regardless of winner)
                    const updatedLeft = winner === 'left'
                        ? { ...teamData.left, sets: teamData.left.sets + 1, score: 0, timeouts: 0 }
                        : { ...teamData.left, score: 0, timeouts: 0 };

                    const updatedRight = winner === 'right'
                        ? { ...teamData.right, sets: teamData.right.sets + 1, score: 0, timeouts: 0 }
                        : { ...teamData.right, score: 0, timeouts: 0 };

                    // Now switch sides: left becomes right, right becomes left
                    const newData = {
                        left: updatedRight,
                        right: updatedLeft
                    };
                    setTeamData(newData);
                    // Broadcast the change
                    broadcastChannel.postMessage({ type: 'UPDATE_STATE', teamData: newData, setHistory: newHistory });

                    setTimeout(() => {
                        setShowConfetti(false);
                        setWinnerMessage('');
                        // Broadcast confetti end
                        broadcastChannel.postMessage({
                            type: 'UPDATE_CONFETTI',
                            showConfetti: false,
                            winnerMessage: '',
                            setHistory: newHistory
                        });
                    }, 500);
                }, 3000);

                setMenuOpen(false);
            };

            const resetSet = () => {
                if (confirm('Sei sicuro di voler resettare il set corrente?')) {
                    const newData = {
                        left: { ...teamData.left, score: 0, timeouts: 0 },
                        right: { ...teamData.right, score: 0, timeouts: 0 }
                    };
                    setTeamData(newData);
                    // Broadcast the change
                    broadcastChannel.postMessage({ type: 'UPDATE_STATE', teamData: newData, setHistory });
                    setMenuOpen(false);
                }
            };

            const resetMatch = () => {
                if (confirm('Sei sicuro di voler resettare la partita?')) {
                    const newData = {
                        left: DEFAULT_LEFT_TEAM,
                        right: DEFAULT_RIGHT_TEAM
                    };
                    setTeamData(newData);
                    setSetHistory([]);
                    // Broadcast the change
                    broadcastChannel.postMessage({ type: 'UPDATE_STATE', teamData: newData, setHistory: [] });
                    setMenuOpen(false);
                }
            };

            const toggleManualEdit = () => {
                setManualEditMode(!manualEditMode);
                setMenuOpen(false);
            };

            const openDisplayWindow = () => {
                if (displayWindow && !displayWindow.closed) {
                    displayWindow.focus();
                } else {
                    // Build the display URL - preserve protocol, host, pathname and current params (e.g. layout), add display param
                    const displayUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?display=true${window.location.search.replace(/^\?/, '&')}`;
                    const newWindow = window.open(
                        displayUrl,
                        'DisplayWindow',
                        'width=1920,height=1080'
                    );
                    setDisplayWindow(newWindow);
                }
                setMenuOpen(false);
            };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error('Error attempting to enable fullscreen:', err);
                    });
                } else {
                    document.exitFullscreen();
                }
                setMenuOpen(false);
            };

            const getCurrentDate = () => {
                const today = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                return today.toLocaleDateString('it-IT', options);
            };

            const getCurrentSet = () => {
                return teamData.left.sets + teamData.right.sets + 1;
            };

            const matchStarted = teamData.left.score > 0 || teamData.right.score > 0 || teamData.left.sets > 0 || teamData.right.sets > 0;

            // Render display-only mode if URL has display=true parameter
            if (isDisplayMode && urlParams.get('layout') === 'band') {
                return (
                    <BandScoreboard
                        teamData={teamData}
                        setHistory={setHistory}
                        showConfetti={showConfetti}
                        winnerMessage={winnerMessage}
                        maxTimeouts={maxTimeouts}
                    />
                );
            }

            if (isDisplayMode) {
                return (
                    <DisplayOnlyScoreboard
                        teamData={teamData}
                        setHistory={setHistory}
                        showConfetti={showConfetti}
                        winnerMessage={winnerMessage}
                    />
                );
            }

            // Render full control mode
            return (
                <div className="h-screen bg-black text-white flex flex-col relative overflow-hidden">
                    {/* Confetti Overlay */}
                    {showConfetti && (
                        <div className="fixed inset-0 z-50 pointer-events-none overflow-hidden">
                            <div className="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                                <div className="winner-message font-bold text-yellow-400 animate-pulse">
                                    {winnerMessage}
                                </div>
                            </div>
                            {[...Array(50)].map((_, i) => (
                                <div
                                    key={i}
                                    className="absolute animate-fall"
                                    style={{
                                        left: `${Math.random() * 100}%`,
                                        top: `-20px`,
                                        animationDelay: `${Math.random() * 0.5}s`,
                                        animationDuration: `${2 + Math.random() * 2}s`
                                    }}
                                >
                                    <div
                                        className={`w-3 h-3 ${
                                            Math.random() > 0.5 ? 'bg-yellow-400' : 'bg-white'
                                        } rounded-full`}
                                    />
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Top Stripe - Venue and Date */}
                    <div className="bg-yellow-400 text-black py-3 px-6">
                        <div className="flex justify-between items-center">
                            <div className="venue-text font-bold">
                                Palestra "R. Barion"
                            </div>
                            <div className="date-text font-semibold">
                                {getCurrentDate()}
                            </div>
                        </div>
                    </div>

                    {/* Main Scoreboard */}
                    <div className="flex-1 flex min-h-0">
                        <TeamPanel
                            side="left"
                            team={teamData.left}
                            matchStarted={matchStarted}
                            manualEditMode={manualEditMode}
                            onChangeName={changeName}
                            onChangeLogo={changeLogo}
                            onUpdateTimeouts={updateTimeouts}
                            onUpdateScore={updateScore}
                        />

                        {/* Center Divider with Menu and Current Set */}
                        <div className="w-40 bg-yellow-400 flex flex-col relative">
                            {/* Current Set Indicator - At Top */}
                            <div className="py-6 text-center border-b-2 border-black">
                                <div className="current-set-label text-black font-bold mb-2">
                                    SET
                                </div>
                                <div className="current-set-number text-black font-bold">
                                    {getCurrentSet()}
                                </div>
                            </div>

                            {/* Sets Won Display */}
                            <div className="py-4 text-center border-b-2 border-black">
                                <div className="sets-label text-black font-bold">
                                    SET
                                </div>
                                <div className="flex justify-center items-center gap-4">
                                    <div className="sets-number text-black font-bold">{teamData.left.sets}</div>
                                    <div className="text-black font-bold text-2xl">-</div>
                                    <div className="sets-number text-black font-bold">{teamData.right.sets}</div>
                                </div>
                            </div>

                            {/* Set History Bubbles - Vertically Stacked */}
                            <div className="flex-1 flex flex-col items-center justify-start py-4 overflow-y-auto">
                                {setHistory.length > 0 && (
                                    <div className="flex flex-col gap-4 w-full px-4">
                                        {setHistory.map((set, index) => {
                                            // Use the saved winner theme for color
                                            const winnerTheme = set.winnerTheme || { bgColor: 'bg-black', textColor: 'text-white' };
                                            const winnerColor = `${winnerTheme.bgColor} ${winnerTheme.textColor}`;

                                            // Determine scores based on CURRENT team positions
                                            // We need to find which historical score belongs to the current left/right team
                                            let currentLeftScore, currentRightScore;

                                            // Check if the current left team was on the left when this set was played
                                            if (teamData.left.name === set.leftTeamName) {
                                                // No swap needed - current left was historical left
                                                currentLeftScore = set.leftScore;
                                                currentRightScore = set.rightScore;
                                            } else {
                                                // Swap needed - current left was historical right
                                                currentLeftScore = set.rightScore;
                                                currentRightScore = set.leftScore;
                                            }

                                            return (
                                                <div
                                                    key={index}
                                                    className={`${winnerColor} rounded-lg px-2 py-2 text-center`}
                                                >
                                                    <div className="flex items-center justify-center gap-2">
                                                        <span className="text-lg font-semibold">#{index + 1}:</span>
                                                        <span className="font-bold text-2xl">{currentLeftScore}-{currentRightScore}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* Menu Button */}
                            <div className="relative">
                                <button
                                    onClick={() => setMenuOpen(!menuOpen)}
                                    className="w-full py-4 bg-yellow-400 text-black hover:bg-yellow-500 transition flex items-center justify-center"
                                >
                                    <Menu size={24} />
                                </button>

                                {menuOpen && (
                                    <div className="absolute bottom-full left-0 right-0 bg-black border-2 border-yellow-400 shadow-lg">
                                        <button
                                            onClick={openDisplayWindow}
                                            className="w-full py-3 px-4 text-yellow-400 hover:bg-gray-900 transition flex items-center justify-center gap-2 border-b border-yellow-400"
                                        >
                                            <Monitor size={18} />
                                            <span className="text-sm">Apri Display</span>
                                        </button>
                                        <button
                                            onClick={endSet}
                                            className="w-full py-3 px-4 text-yellow-400 hover:bg-gray-900 transition flex items-center justify-center gap-2 border-b border-yellow-400"
                                        >
                                            <Flag size={18} />
                                            <span className="text-sm">Fine Set</span>
                                        </button>
                                        <button
                                            onClick={switchSides}
                                            className="w-full py-3 px-4 text-yellow-400 hover:bg-gray-900 transition flex items-center justify-center gap-2 border-b border-yellow-400"
                                        >
                                            <RotateCw size={18} />
                                            <span className="text-sm">Cambia Lato</span>
                                        </button>
                                        <button
                                            onClick={toggleManualEdit}
                                            className="w-full py-3 px-4 text-yellow-400 hover:bg-gray-900 transition flex items-center justify-center gap-2 border-b border-yellow-400"
                                        >
                                            <Edit size={18} />
                                            <span className="text-sm">{manualEditMode ? 'Esci Modifica' : 'Modifica Manuale'}</span>
                                        </button>
                                        <button
                                            onClick={resetSet}
                                            className="w-full py-3 px-4 text-yellow-400 hover:bg-gray-900 transition flex items-center justify-center gap-2 border-b border-yellow-400"
                                        >
                                            <RotateCw size={18} />
                                            <span className="text-sm">Reset Set</span>
                                        </button>
                                        <button
                                            onClick={resetMatch}
                                            className="w-full py-3 px-4 text-yellow-400 hover:bg-gray-900 transition flex items-center justify-center gap-2"
                                        >
                                            <RotateCw size={18} />
                                            <span className="text-sm">Reset Partita</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        <TeamPanel
                            side="right"
                            team={teamData.right}
                            matchStarted={matchStarted}
                            manualEditMode={manualEditMode}
                            onChangeName={changeName}
                            onChangeLogo={changeLogo}
                            onUpdateTimeouts={updateTimeouts}
                            onUpdateScore={updateScore}
                        />
                    </div>
                </div>
            );
        }

        ReactDOM.render(<VolleyScoreboard />, document.getElementById('root'));
    </script>
</body>
</html>
